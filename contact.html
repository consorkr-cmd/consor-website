  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0c0c0c;
      --fg: #e8e8e8;
      --mid: #666;
      --subtle: #999;
      --rule: #222;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Helvetica Neue', Helvetica, 'Pretendard Variable', Pretendard, sans-serif;
      background: var(--bg);
      color: var(--fg);
      font-size: 14px;
    }

    a { color: inherit; text-decoration: none; }

    /* ─── HEADER ─── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 32px;
      height: 52px;
    }

    .logo img {
      height: 22px;
      display: block;
      filter: brightness(0) invert(1);
      opacity: 0.9;
    }

    nav { display: flex; gap: 32px; }

    nav a {
      font-size: 13px;
      font-weight: 500;
      color: var(--mid);
      letter-spacing: 0.07em;
      transition: color 0.15s;
    }
    nav a:hover { color: var(--fg); }
    nav a.active { color: var(--fg); }

    /* ─── HERO ─── */
    .page-hero {
      padding: 88px 40px 72px;
      border-bottom: 1px solid var(--rule);
    }

    .page-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 28px;
    }

    .page-title {
      font-size: clamp(52px, 9vw, 120px);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    /* ─── FORM SECTION ─── */
    .contact-form-section {
      padding: 72px 40px 80px;
      border-bottom: 1px solid var(--rule);
      max-width: 860px;
    }

    .block-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 40px;
    }

    form { display: flex; flex-direction: column; gap: 0; }

    .field {
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid var(--rule);
      padding: 16px 0;
    }

    .field label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 8px;
    }

    .field input,
    .field textarea,
    .field select {
      background: none;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--fg);
      width: 100%;
      appearance: none;
    }

    .field textarea { resize: none; height: 80px; }
    .field select option { background: var(--bg); }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .form-row .field:first-child {
      border-right: 1px solid var(--rule);
      padding-right: 32px;
    }
    .form-row .field:last-child { padding-left: 32px; }

    .submit-row { padding-top: 32px; }

    button[type=submit] {
      background: var(--fg);
      color: var(--bg);
      border: none;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 14px 36px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button[type=submit]:hover { background: #bbb; }

    /* ─── INFO BAR ─── */
    .contact-info-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid var(--rule);
    }

    .info-item {
      padding: 40px 40px;
      border-right: 1px solid var(--rule);
    }
    .info-item:last-child { border-right: none; }

    .info-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 12px;
    }

    .info-value {
      font-size: 15px;
      font-weight: 500;
      transition: color 0.15s;
    }
    a.info-value:hover { color: var(--mid); }

    /* ─── FOOTER ─── */
    footer {
      border-top: 1px solid var(--rule);
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-logo img {
      height: 18px;
      display: block;
      filter: brightness(0) invert(1);
      opacity: 0.5;
    }

    .footer-mid { font-size: 12px; color: var(--mid); }

    .footer-right { display: flex; gap: 24px; }
    .footer-right a {
      font-size: 12px;
      color: var(--mid);
      transition: color 0.15s;
    }
    .footer-right a:hover { color: var(--fg); }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 760px) {
      .contact-info-bar { grid-template-columns: repeat(2, 1fr); }
      .info-item:nth-child(2) { border-right: none; }
      .info-item:nth-child(3) { border-top: 1px solid var(--rule); }
      .info-item:nth-child(4) { border-top: 1px solid var(--rule); border-right: none; }
    }

    @media (max-width: 600px) {
      header { padding: 0 20px; }
      .page-hero { padding: 52px 20px 44px; }
      .contact-form-section { padding: 48px 20px 56px; }
      .form-row { grid-template-columns: 1fr; }
      .form-row .field:first-child { border-right: none; padding-right: 0; }
      .form-row .field:last-child { padding-left: 0; }
      .contact-info-bar { grid-template-columns: 1fr 1fr; }
      .info-item { padding: 28px 20px; }
      footer { padding: 20px; flex-direction: column; gap: 12px; align-items: flex-start; }
    }

  <header>
    <a href="index.html" class="logo"><img src="logo.png" alt="CONSOR."></a>
    <nav>
      <a href="work.html">Work</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>

  <div class="page-hero">
    <div class="page-eyebrow">Contact</div>
    <h1 class="page-title">Make Growth<br>With Us.</h1>
  </div>

  <div class="contact-form-section">
    <div class="block-label">Send a Message</div>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" onsubmit="handleSubmit(event)">
        <input type="hidden" name="form-name" value="contact">
        <p hidden><input name="bot-field"></p>
      <div class="form-row">
        <div class="field">
          <label>Name</label>
          <input type="text" name="name" placeholder="홍길동" required>
        </div>
        <div class="field">
          <label>Company</label>
          <input type="text" name="company" placeholder="회사명">
        </div>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" placeholder="hello@brand.com" required>
      </div>
      <div class="field">
        <label>Service</label>
        <select name="service">
          <option value="">선택해주세요</option>
          <option>Brand Strategy</option>
          <option>Brand Identity</option>
          <option>Brand Marketing</option>
          <option>CX Design</option>
          <option>Brand Incubating</option>
          <option>기타 문의</option>
        </select>
      </div>
      <div class="field">
        <label>Message</label>
        <textarea name="message" placeholder="브랜드에 대해 간략히 알려주세요..." required></textarea>
      </div>
      <div class="submit-row">
        <button type="submit" id="submitBtn">Send Message</button>
      </div>
    </form>
  </div>

  <div class="contact-info-bar">
    <div class="info-item">
      <div class="info-label">Phone</div>
      <a href="tel:+821063384857" class="info-value">010-6338-4857</a>
    </div>
    <div class="info-item">
      <div class="info-label">Email</div>
      <a href="mailto:consor.kr@gmail.com" class="info-value">consor.kr@gmail.com</a>
    </div>
    <div class="info-item">
      <div class="info-label">Instagram</div>
      <a href="https://instagram.com/consor.kr" target="_blank" class="info-value">@consor.kr</a>
    </div>
    <div class="info-item">
      <div class="info-label">Location</div>
      <span class="info-value">Seoul, Korea</span>
    </div>
  </div>

  <footer>
    <div class="footer-logo"><img src="logo.png" alt="CONSOR."></div>
    <div class="footer-mid">© 2025 CONSOR. All rights reserved.</div>
    <div class="footer-right">
      <a href="https://instagram.com/consor.kr" target="_blank">Instagram</a>
      <a href="mailto:consor.kr@gmail.com">Email</a>
    </div>
  </footer>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const btn = document.getElementById('submitBtn');
      btn.textContent = 'Sending...';
      fetch('/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams(new FormData(form)).toString()
      }).then(() => {
        btn.textContent = 'Sent ✓';
        btn.style.background = '#2a6e47';
        setTimeout(() => {
          btn.textContent = 'Send Message';
          btn.style.background = '';
          form.reset();
        }, 3000);
      }).catch(() => {
        btn.textContent = 'Error — email us';
        btn.style.background = '#8a2a2a';
      });
    }
  </script>

</body>
