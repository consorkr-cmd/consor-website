  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0c0c0c;
      --fg: #e8e8e8;
      --mid: #666;
      --subtle: #999;
      --rule: #222;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Helvetica Neue', Helvetica, 'Pretendard Variable', Pretendard, sans-serif;
      background: var(--bg);
      color: var(--fg);
      font-size: 14px;
    }

    a { color: inherit; text-decoration: none; }

    /* ─── HEADER ─── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 32px;
      height: 52px;
    }

    .logo img {
      height: 22px;
      display: block;
      filter: brightness(0) invert(1);
      opacity: 0.9;
    }

    .back-link {
      font-size: 12px;
      font-weight: 500;
      color: var(--mid);
      letter-spacing: 0.07em;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--fg); }

    /* ─── HERO ─── */
    .project-hero {
      padding: 80px 40px 64px;
      border-bottom: 1px solid var(--rule);
    }

    .project-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 40px;
    }

    .project-title-en {
      font-size: clamp(44px, 8vw, 112px);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.04em;
      margin-bottom: 16px;
      word-break: keep-all;
    }

    .project-title-kr {
      font-size: clamp(16px, 2vw, 26px);
      font-weight: 400;
      color: var(--mid);
      letter-spacing: -0.02em;
      margin-bottom: 56px;
    }

    .project-meta {
      display: flex;
      gap: 48px;
      flex-wrap: wrap;
      border-top: 1px solid var(--rule);
      padding-top: 28px;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .meta-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--mid);
    }

    .meta-value {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    /* ─── DESC ─── */
    .project-desc {
      padding: 48px 40px 56px;
      border-bottom: 1px solid var(--rule);
      max-width: 760px;
    }

    .project-desc p {
      font-size: clamp(15px, 1.5vw, 18px);
      line-height: 1.8;
      color: var(--subtle);
      letter-spacing: -0.03em;
    }

    /* ─── IMAGES ─── */
    .project-images {
      border-bottom: 1px solid var(--rule);
    }

    .img-block {
      overflow: hidden;
      border-bottom: 1px solid var(--rule);
    }

    .img-block:last-child { border-bottom: none; }

    .img-block img {
      width: 100%;
      display: block;
      aspect-ratio: 16/9;
      object-fit: cover;
    }

    .img-fill {
      width: 100%;
      aspect-ratio: 16/9;
    }

    /* ─── BOTTOM NAV ─── */
    .project-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 32px 40px;
      border-bottom: 1px solid var(--rule);
    }

    .project-nav a {
      font-size: 13px;
      font-weight: 500;
      color: var(--mid);
      letter-spacing: 0.02em;
      transition: color 0.15s;
    }

    .project-nav a:hover { color: var(--fg); }

    /* ─── FOOTER ─── */
    footer {
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-logo img {
      height: 18px;
      display: block;
      filter: brightness(0) invert(1);
      opacity: 0.5;
    }

    .footer-mid { font-size: 12px; color: var(--mid); }

    .footer-right { display: flex; gap: 24px; }
    .footer-right a {
      font-size: 12px;
      color: var(--mid);
      transition: color 0.15s;
    }
    .footer-right a:hover { color: var(--fg); }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 600px) {
      header { padding: 0 20px; }
      .project-hero { padding: 48px 20px 40px; }
      .project-meta { gap: 28px; flex-direction: column; }
      .project-desc { padding: 36px 20px 44px; }
      .project-nav { padding: 24px 20px; }
      footer { padding: 20px; flex-direction: column; gap: 12px; align-items: flex-start; }
    }

  <script src="projects.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const project = PROJECTS[id];

    if (!project) {
      window.location.href = 'work.html';
    } else {
      // SEO: title
      document.title = project.seoTitle || (project.titleEn + ' — CONSOR.');

      // SEO: meta description
      let metaDesc = document.querySelector('meta[name="description"]');
      if (!metaDesc) {
        metaDesc = document.createElement('meta');
        metaDesc.name = 'description';
        document.head.appendChild(metaDesc);
      }
      metaDesc.content = project.seoDesc || project.desc || '';
      // SEO: canonical + OG (프로젝트별 동적)
      var _u = 'https://consor.kr/project?id=' + id;
      var _t = project.seoTitle || (project.titleEn + ' — CONSOR.');
      var _d = project.seoDesc || project.desc || '';
      var _img = (project.images && project.images.length)
                 ? 'https://consor.kr/' + project.images[0]
                 : 'https://consor.kr/og-image.png';
      var _set = function(id2, attr, val){ var el=document.getElementById(id2); if(el) el.setAttribute(attr, val); };
      _set('canonical-link','href',_u);
      _set('og-url','content',_u);
      _set('og-title','content',_t);   _set('tw-title','content',_t);
      _set('og-desc','content',_d);     _set('tw-desc','content',_d);
      _set('og-image','content',_img);

      const imagesHtml = project.images && project.images.length > 0
        ? project.images.map(src => `
          <div class="img-block">
            <img src="${src}" alt="${project.titleEn}">
          </div>`).join('')
        : `<div class="img-block">
            <div class="img-fill" style="background:${project.fill}"></div>
          </div>`;

      const ids = Object.keys(PROJECTS);
      const currentIndex = ids.indexOf(id);
      const nextId = ids[currentIndex + 1];
      const prevId = ids[currentIndex - 1];

      const navHtml = `
        ${prevId ? `<a href="project.html?id=${prevId}">← ${PROJECTS[prevId].titleEn}</a>` : '<span></span>'}
        ${nextId ? `<a href="project.html?id=${nextId}">${PROJECTS[nextId].titleEn} →</a>` : '<span></span>'}
      `;

      document.getElementById('project-content').innerHTML = `
        <div class="project-hero">
          <div class="project-eyebrow">Work</div>
          <h1 class="project-title-en">${project.titleEn}</h1>
          <h2 class="project-title-kr">${project.titleKr}</h2>
          <div class="project-meta">
            <div class="meta-item">
              <span class="meta-label">기간</span>
              <span class="meta-value">${project.period}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">업무스콥</span>
              <span class="meta-value">${project.scope}</span>
            </div>
          </div>
        </div>

        ${project.desc ? `<div class="project-desc"><p>${project.desc}</p></div>` : ''}

        <div class="project-images">${imagesHtml}</div>

        <div class="project-nav">${navHtml}</div>
      `;
    }
  </script>
